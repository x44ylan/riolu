[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "riolu"
version = "0.2.0"
description = "A modular Telegram assistant for news, notes, host monitoring, and OpenCode"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.12.3",
    "httpx>=0.27.0",
    "mcp>=2.0.0,<3",
    "python-dotenv>=1.0.1",
]

[project.scripts]
riolu = "riolu.app:main"
riolu-mcp = "riolu.agent.mcp:main"
riolu-agent = "riolu.agent.worker:main"

[tool.setuptools.packages.find]
include = ["riolu*"]
