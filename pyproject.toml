[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "riolu"
version = "0.2.0"
description = "Private Telegram information PA with modular sources, RSS subscriptions, and reminders"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.12.3",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.1",
]

[project.scripts]
riolu = "riolu.app:main"

[tool.setuptools.packages.find]
include = ["riolu*"]
